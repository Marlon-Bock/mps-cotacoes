# Configuração Nginx local para o Herd (mps.test)
# O Herd carrega este arquivo automaticamente para o site.
#
# Em PRODUÇÃO, use o arquivo nginx.conf da raiz do servidor —
# a lógica é a mesma, apenas ajuste root e server_name.

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Bloqueia acesso direto a arquivos sensíveis
location ~ /\.(env|git|herd) {
    deny all;
    return 404;
}

location ~ ^/(src|pages|includes|storage|telas)/ {
    deny all;
    return 404;
}
